<svg style="font-family:WenQuanYi Micro Hei,Microsoft YaHei,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="建议数据流"><rect width="620" height="300" rx="5" fill="#1d3330"/><text x="18" y="30" fill="#9bcfbd" font-size="11" font-weight="bold">PROPOSED DATA BOUNDARIES</text><text x="18" y="61" fill="white" font-size="13" font-weight="bold">权重：压紧后存，读取再展开</text>
<rect x="18" y="77" width="102" height="50" rx="3" fill="#bfe9d8"/><text x="69" y="98" text-anchor="middle" fill="#142322" font-size="11" font-weight="bold">FP4 编码</text><text x="69" y="115" text-anchor="middle" fill="#38534a" font-size="9">4 bit / 元素</text><path d="M128 102h26m-7-6 7 6-7 6" stroke="#91c9b1" stroke-width="2" fill="none"/><rect x="161" y="77" width="118" height="50" rx="3" fill="#167e76"/><text x="220" y="98" text-anchor="middle" fill="white" font-size="11" font-weight="bold">权重 SRAM</text><text x="220" y="115" text-anchor="middle" fill="#d7f2e7" font-size="9">512 bit / 行</text><path d="M287 102h26m-7-6 7 6-7 6" stroke="#91c9b1" stroke-width="2" fill="none"/><rect x="320" y="77" width="124" height="50" rx="3" fill="#f1c75b"/><text x="382" y="98" text-anchor="middle" fill="#142322" font-size="11" font-weight="bold">FP4 → INT5</text><text x="382" y="115" text-anchor="middle" fill="#514719" font-size="9">读口之后</text><path d="M452 102h26m-7-6 7 6-7 6" stroke="#91c9b1" stroke-width="2" fill="none"/><rect x="485" y="77" width="116" height="50" rx="3" fill="#d7644e"/><text x="543" y="107" text-anchor="middle" fill="white" font-size="12" font-weight="bold">PE</text>
<line x1="18" y1="145" x2="602" y2="145" stroke="#45625a"/><text x="18" y="174" fill="white" font-size="13" font-weight="bold">输出：保留整数部分和及 scale，读后完成 FP32</text>
<rect x="18" y="190" width="120" height="50" rx="3" fill="#bfe9d8"/><text x="78" y="210" text-anchor="middle" fill="#142322" font-size="10" font-weight="bold">INT14 部分和</text><text x="78" y="227" text-anchor="middle" fill="#38534a" font-size="9">每 32 项一块</text><path d="M146 215h24m-7-6 7 6-7 6" stroke="#91c9b1" stroke-width="2" fill="none"/><rect x="178" y="190" width="124" height="50" rx="3" fill="#466d83"/><text x="240" y="210" text-anchor="middle" fill="white" font-size="10" font-weight="bold">输出 SRAM</text><text x="240" y="227" text-anchor="middle" fill="#e2eef3" font-size="9">部分和 + scale</text><path d="M310 215h24m-7-6 7 6-7 6" stroke="#91c9b1" stroke-width="2" fill="none"/><rect x="342" y="190" width="130" height="50" rx="3" fill="#f1c75b"/><text x="407" y="210" text-anchor="middle" fill="#142322" font-size="10" font-weight="bold">scale + FP32</text><text x="407" y="227" text-anchor="middle" fill="#514719" font-size="9">输出读路径</text><path d="M480 215h24m-7-6 7 6-7 6" stroke="#91c9b1" stroke-width="2" fill="none"/><rect x="512" y="190" width="89" height="50" rx="3" fill="#d7644e"/><text x="556" y="212" text-anchor="middle" fill="white" font-size="10" font-weight="bold">四块归约</text><text x="556" y="228" text-anchor="middle" fill="#fff2ed" font-size="8">最终 FP32</text><text x="18" y="277" fill="#aec1b8" font-size="9">减少 SRAM 数据位数的收益，要扣除新增译码器与读出延迟。</text></svg>